<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>AI猫面接シミュレーター</title>
    <style>
        body {
            /* 優しいパステルピンクの背景色 */
            background-color: #fce4ec; 
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .game-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            border: 4px solid #ffb6c1; /* 可愛いピンクの枠線 */
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #d81b60;
            font-size: 24px;
        }
        p {
            color: #555;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐾 伝説のPM猫を採用せよ！</h1>
        
        <!-- もし猫の画像を作って同じ場所に置けば表示されるっす -->
        <img src="cat.png" width="200" alt="PM猫" onerror="this.style.display='none'">
        
        <p>ギルドの運命は、あなたの面接スキルにかかっているにゃ。</p>

        <!-- ↓お嬢様が持ってきたDifyの埋め込みコードっす！↓ -->
        <iframe
         src="https://udify.app/chatbot/LrvbbLCDEazcAKG2"
         style="width: 100%; height: 100%; min-height: 700px"
         frameborder="0"
         allow="microphone">
        </iframe>

    </div>
</body>
</html>
