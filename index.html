<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI猫面接シミュレーター</title>
    <style>
        body {
            background-color: #fce4ec; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
            padding: 10px; 
            box-sizing: border-box;
        }
        /* ゲーム全体を包むコンテナ */
        .game-container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        /* タイトルと説明文 */
        .game-title {
            color: #d81b60;
            font-size: 24px;
            margin: 0 0 5px 0;
        }
        .game-desc {
            color: #555;
            font-size: 14px;
            margin: 0 0 15px 0;
        }
        /* ゲーム画面本体 */
        .game-screen {
            position: relative;
            width: 100%;
            height: 65vh; 
            min-height: 480px;
            max-height: 600px;
            background-color: #fff0f5; 
            border: 4px solid #ffb6c1;
            border-radius: 10px;
            display: flex;
            flex-direction: column; 
            overflow: hidden;
        }
        /* 画像エリア（残りのスペースを全部使う） */
        .character-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-end; 
            overflow: hidden;
            padding: 10px;
        }
        .character {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain; 
            transition: all 0.3s ease;
        }
        /* UIエリア（一番下） */
        .ui-bottom {
            padding: 10px;
            background: rgba(255, 255, 255, 0.5); 
        }
        .input-area {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 2px solid #ffb6c1;
        }
        button {
            padding: 0 20px;
            font-size: 16px;
            background-color: #d81b60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .dialogue-box {
            height: 100px;
            background: rgba(0, 50, 100, 0.85);
            border: 2px solid #88ccff;
            color: #fff;
            padding: 15px;
            border-radius: 5px;
            text-align: left;
            overflow-y: auto;
        }
        .speaker {
            color: #88ccff;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }
        .message {
            font-size: 15px;
            line-height: 1.5;
        }
        /* 考え中表示 */
        .loading {
            display: none;
            color: #d81b60;
            font-weight: bold;
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255,255,255,0.9);
            padding: 5px 10px;
            border-radius: 5px;
            z-index: 10;
        }
        /* PC向けの微調整 */
        @media (min-width: 600px) {
            .game-title { font-size: 28px; }
            .game-desc { font-size: 16px; }
            .dialogue-box { height: 120px; }
            .message { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">🐾 伝説のPM猫を採用せよ！</h1>
        <p class="game-desc">ギルドの運命は、あなたの面接スキルにかかっているにゃ。</p>

        <div class="game-screen">
            <div class="loading" id="loading">🐾 猫が考えているにゃ...</div>
            
            <div class="character-area">
                <img src="cat_00.png" class="character" id="cat-image" alt="猫">
            </div>
            
            <div class="ui-bottom">
                <div class="input-area">
                    <input type="text" id="user-input" placeholder="猫に話しかける言葉を入力...">
                    <button onclick="sendMessage()">送信</button>
                </div>
                <div class="dialogue-box">
                    <div class="speaker">伝説のPM猫</div>
                    <div class="message" id="cat-message">にゃーん。（上の枠から話しかけてみてね）</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ★★★ ここにさっきコピーしたAPIキーを貼り付けるっす！ ★★★
        const apiKey = 'app-VKUgziOJxnhMRja03TihFcPa'; 
        
        let conversationId = "";

        // Enterキーで送信できるようにするおまけ機能っす
        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const messageBox = document.getElementById('cat-message');
            const loading = document.getElementById('loading');
            const catImage = document.getElementById('cat-image');
            
            const text = inputField.value;
            if (!text) return;

            inputField.value = '';
            messageBox.innerText = '...';
            loading.style.display = 'block';

            try {
                const response = await fetch('https://api.dify.ai/v1/chat-messages', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        inputs: {},
                        query: text,
                        response_mode: 'blocking',
                        conversation_id: conversationId || undefined,
                        user: 'ojousama-player'
                    })
                });

                const data = await response.json();
                loading.style.display = 'none';

                if (data.answer) {
                    let answer = data.answer;
                    
                    if (answer.includes('cat_00.png')) catImage.src = 'cat_00.png';
                    if (answer.includes('cat_01.png')) catImage.src = 'cat_01.png';
                    if (answer.includes('cat_02.png')) catImage.src = 'cat_02.png';
                    if (answer.includes('cat_03.png')) catImage.src = 'cat_03.png';
                    if (answer.includes('cat_04.png')) catImage.src = 'cat_04.png';

                    answer = answer.replace(/!\[.*?\]\(.*?\)/g, '').trim();
                    messageBox.innerText = answer;
                    
                    conversationId = data.conversation_id;
                } else {
                    messageBox.innerText = 'エラーになっちゃったっす...';
                }
            } catch (error) {
                loading.style.display = 'none';
                messageBox.innerText = '通信に失敗したっす！';
            }
        }
    </script>
</body>
</html>
