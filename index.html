<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>AI猫面接シミュレーター</title>
    <style>
        body {
            background-color: #000;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }
        .game-screen {
            position: relative;
            width: 800px;
            height: 600px;
            background-color: #fce4ec; /* 優しいパステルピンク */
            overflow: hidden;
            border: 4px solid #ffb6c1;
        }
        /* キャラクター画像の配置 */
        .character {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 350px;
            transition: all 0.3s ease;
        }
        /* FGO風のセリフ枠 */
        .dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 120px;
            background: rgba(0, 50, 100, 0.8);
            border: 2px solid #88ccff;
            color: #fff;
            padding: 15px;
            border-radius: 5px;
        }
        .speaker {
            color: #88ccff;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 10px;
        }
        .message {
            font-size: 18px;
            line-height: 1.5;
        }
        /* 入力エリア */
        .input-area {
            position: absolute;
            bottom: 180px;
            left: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 2px solid #ffb6c1;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #d81b60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        /* 考え中表示 */
        .loading {
            display: none;
            color: #d81b60;
            font-weight: bold;
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.8);
            padding: 5px 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="game-screen">
        <div class="loading" id="loading">🐾 猫が考えているにゃ...</div>
        
        <!-- 初期画像 -->
        <img src="cat_00.png" class="character" id="cat-image" alt="猫">
        
        <!-- プレイヤーの入力エリア -->
        <div class="input-area">
            <input type="text" id="user-input" placeholder="猫に話しかける言葉を入力...">
            <button onclick="sendMessage()">送信</button>
        </div>

        <!-- セリフ枠 -->
        <div class="dialogue-box">
            <div class="speaker">伝説のPM猫</div>
            <div class="message" id="cat-message">にゃーん。（上の枠から話しかけてみてね）</div>
        </div>
    </div>

    <script>
        // ★★★ ここにさっきコピーしたAPIキーを貼り付けるっす！ ★★★
        const apiKey = 'app-VKUgziOJxnhMRja03TihFcPa'; 
        
        let conversationId = "";

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const messageBox = document.getElementById('cat-message');
            const loading = document.getElementById('loading');
            const catImage = document.getElementById('cat-image');
            
            const text = inputField.value;
            if (!text) return;

            // ユーザーの入力を一旦リセットして、ローディングを表示
            inputField.value = '';
            messageBox.innerText = '...';
            loading.style.display = 'block';

            try {
                // DifyのAPIに話しかける
                const response = await fetch('https://api.dify.ai/v1/chat-messages', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        inputs: {},
                        query: text,
                        response_mode: 'blocking',
                        conversation_id: conversationId || undefined,
                        user: 'ojousama-player'
                    })
                });

                const data = await response.json();
                loading.style.display = 'none';

                if (data.answer) {
                    let answer = data.answer;
                    
                    // プロンプトから返ってきたURLを検知して、猫の画像を切り替える仕組みっす！
                    if (answer.includes('cat_00.png')) catImage.src = 'cat_00.png';
                    if (answer.includes('cat_01.png')) catImage.src = 'cat_01.png';
                    if (answer.includes('cat_02.png')) catImage.src = 'cat_02.png';
                    if (answer.includes('cat_03.png')) catImage.src = 'cat_03.png';
                    if (answer.includes('cat_04.png')) catImage.src = 'cat_04.png';

                    // 画面のセリフ枠には画像URLを出したくないので、テキストだけ綺麗に抜き取るっす
                    answer = answer.replace(/!\[.*?\]\(.*?\)/g, '').trim();
                    messageBox.innerText = answer;
                    
                    // 会話の続きができるようにIDを保存するっす
                    conversationId = data.conversation_id;
                } else {
                    messageBox.innerText = 'エラーになっちゃったっす...';
                }
            } catch (error) {
                loading.style.display = 'none';
                messageBox.innerText = '通信に失敗したっす！';
            }
        }
    </script>
</body>
</html>
