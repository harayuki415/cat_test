<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>AI猫面接シミュレーター</title>
    <style>
        body {
            background-color: #000; /* 外側は暗く */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .game-screen {
            position: relative;
            width: 800px;
            height: 600px;
            background-color: #fce4ec; /* ピンクの背景 */
            overflow: hidden;
            border: 4px solid #ffb6c1;
        }
        .character {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            width: 350px; /* 猫ちゃんを大きく表示 */
        }
        .dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 120px;
            background: rgba(0, 50, 100, 0.8); /* FGO風の青っぽい半透明 */
            border: 2px solid #88ccff;
            color: #fff;
            padding: 15px;
            font-family: serif;
            border-radius: 5px;
        }
        .speaker {
            color: #88ccff;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 10px;
        }
        .message {
            font-size: 18px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="game-screen">
        <!-- 猫の画像 -->
        <img src="cat_00.png" class="character" alt="猫">
        
        <!-- セリフ枠 -->
        <div class="dialogue-box">
            <div class="speaker">伝説のPM猫</div>
            <div class="message">にゃーん。（※ここにDifyからのセリフが入る予定っす）</div>
        </div>
    </div>
</body>
</html>
