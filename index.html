<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫の手も借りたい</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fdf2f8; /* お嬢様好みの可愛い薄ピンクっす */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .logo {
            max-width: 90%;
            height: auto;
            margin-bottom: 30px;
        }
        .start-btn img {
            max-width: 280px;
            height: auto;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
        }
        /* ボタンにマウスを乗せたら少しぷくっと大きくする演出っす！ */
        .start-btn img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div>
            <img src="titlelogo.png" alt="猫の手も借りたい" class="logo">
        </div>
        <a href="game.html" class="start-btn">
            <img src="startbutton.png" alt="START">
        </a>
    </div>
</body>
</html>
